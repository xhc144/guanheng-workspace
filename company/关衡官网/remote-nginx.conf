server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 0;

    include /etc/nginx/snippets/wechat-auto.conf;

    location = /guanheng {
        return 301 /guanheng/;
    }

    location /guanheng/ {
        alias /var/www/guanheng/;
        index index.html;
    }

    location = /focusflow {
        return 301 /focusflow/;
    }

    location /focusflow/ {
        alias /var/www/focusflow/;
        index index.html;
    }

    location = /personal {
        return 301 /personal/;
    }

    location /personal/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /workspace {
        return 301 /workspace/;
    }

    location /workspace/ {
        alias /var/www/portal-old-20260823-210004/;
        index index.html;
    }

    location /guanheng-media/ {
        alias /var/www/portal/media/;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sprint {
        return 301 /sprint/;
    }

    location /sprint/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /physics {
        return 301 /physics/;
    }

    location /physics/ {
        alias /var/www/physics/;
        index index.html;
    }

    location / {
        root /var/www/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

