<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#dfe7f1;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;color:#10233f}.deck{display:flex;flex-direction:column;gap:48px;padding:48px}.frame{position:relative;width:1920px;height:1080px;overflow:hidden;background:#f7f9fc;box-shadow:0 20px 80px rgba(16,35,63,.18)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(23,107,239,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(23,107,239,.055) 1px,transparent 1px);background-size:72px 72px}.orb{position:absolute;border-radius:999px;background:#176bef}.orb.soft{background:#eaf2ff}.eyebrow{font-size:28px;font-weight:750;letter-spacing:.16em;color:#176bef}.h1{font-size:126px;line-height:1.05;font-weight:900;letter-spacing:-.055em}.h2{font-size:88px;line-height:1.12;font-weight:900;letter-spacing:-.04em}.muted{color:#64748b}.brand{position:absolute;width:720px;height:auto;object-fit:contain}.pill{display:inline-flex;align-items:center;height:52px;padding:0 22px;border:1px solid #c9d8ea;border-radius:999px;background:#fff;font-size:24px;font-weight:700}.chrome{position:absolute;border:1px solid #d5e0ec;border-radius:28px;background:#fff;box-shadow:0 32px 80px rgba(16,35,63,.14);overflow:hidden}.chrome:before{content:"";display:block;height:46px;background:linear-gradient(90deg,#f2f6fb,#fbfdff);border-bottom:1px solid #e5edf5}.node{position:absolute;display:flex;align-items:center;justify-content:center;width:260px;height:94px;border:1px solid #cbd9ea;border-radius:18px;background:#fff;color:#10233f;font-size:28px;font-weight:800}.node.primary{border-color:#176bef;background:#176bef;color:#fff}.line{position:absolute;height:5px;border-radius:5px;background:#176bef;transform-origin:left center}.stat{font-size:204px;line-height:.9;font-weight:950;letter-spacing:-.08em;color:#0757d5}.stat small{font-size:84px;letter-spacing:-.02em}.rule{height:8px;border-radius:8px;background:#176bef}.cta{display:flex;align-items:center;gap:32px;font-size:42px;font-weight:850}.btn{padding:24px 34px;border-radius:14px;background:#176bef;color:#fff;font-size:30px;font-weight:850}.index{position:absolute;right:92px;top:70px;font-size:22px;letter-spacing:.16em;color:#7a8ca5}
  </style>
</head>
<body><div class="deck">

    <div class="rule" style="position:absolute;left:700px;right:700px;bottom:94px"></div>
