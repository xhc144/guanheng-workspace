services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - pms_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - STORAGE_DIR=/data/storage
      - SECRET_KEY=${SECRET_KEY:-change-me-in-prod}

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pms_data:
